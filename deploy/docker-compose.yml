services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: taxcrm
      POSTGRES_USER: taxcrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxcrm"]
      interval: 10s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql://taxcrm:${POSTGRES_PASSWORD}@postgres:5432/taxcrm
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 3001
      HOST: 0.0.0.0
      NODE_ENV: production
      FRONTEND_URL: http://taxcrm.deaddogstudios.com
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ../crm/frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
